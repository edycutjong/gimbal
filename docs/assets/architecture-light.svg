<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 712" width="1420" height="712"
     role="img" aria-labelledby="ttl desc">
  <title id="ttl">Gimbal measurement pipeline</title>
  <desc id="desc">One camera frame passes through eight stages inside a single browser tab with no
network requests after load: camera at 30 Hz, the MediaPipe FaceLandmarker running as vendored
WebAssembly, head-pose yaw, Savitzky-Golay smoothing with an analytic bias correction, peak angular
velocity in degrees per second, hysteretic cycle segmentation, a four-term tracking-quality score, and
scoreCycle. The result is one of two terminals: credited, which adds the cycle duration to the delivered
dose, or refused, with a named reason from too slow, too fast, off cadence, tracking unreliable, or face
left the frame. A refusal is drawn in slate and never in red.</desc>
