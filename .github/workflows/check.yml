name: check

# The correctness gate, as six named stages.
#
# It is deliberately decoupled from the deploy: a red run here does not block
# publishing, and a green one does not trigger one. Release and deploy live in
# release.yml, which runs these same commands again before it ships anything.
#
# Why stages rather than one job: a single job reports one red X, and a reader
# has to open the log to learn whether the type checker or the frame budget
# failed. Six stages name the failure on the checks list itself. Stages 1 and 2
# run in parallel because neither reads the other's output.
#
# EVERY STAGE ASSERTS A CLAIM THIS PROJECT PUBLISHES. That is the rule for
# adding one: if no judge-facing sentence depends on it, it does not belong here.
#   Stage 1 → "100% coverage at an enforced threshold", the mechanical checks,
#             and the published test count against the runner's own report
#   Stage 2 → "npm audit reports zero vulnerabilities" and "1 runtime, 6 dev"
#   Stage 3 → the shipped bundle greps clean (U-DIST)
#   Stage 4 → the accessibility, origin, print and measurement suites
#   Stage 5 → all six gate outcomes, then the frame budget
#   Stage 6 → the aggregate, so a required check has one name

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ── STAGE 1: Quality — types, mechanical checks, coverage ──────────────────
  quality:
    name: 'Stage 1 · Quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # tsc --noEmit over src/ and tests/: strict, plus noUnusedLocals,
      # noUnusedParameters, noFallthroughCasesInSwitch, noUncheckedIndexedAccess.
      # This is what stands in for a linter's generic rule set.
      - name: Type check
        run: npm run typecheck

      # The eight mechanical greps. Air-gapped by construction — every file they
      # read is committed here.
      - name: Mechanical checks
        run: npm run lint

      # Unit tests WITH coverage, which is the point: vitest.config.ts declares a
      # 100% threshold on statements, branches, functions and lines, and running
      # the suite without --coverage never enforces it. The README publishes that
      # number, so CI has to be the thing that holds it.
      - name: Unit tests at the 100% coverage threshold
        run: npm run test:coverage

      # U-COUNT, which reads the runner's JSON report rather than counting
      # `it(` call sites. It is build-dependent by nature, so it runs here
      # rather than inside the air-gapped `checks.mjs` set.
      - name: Published test count matches the runner
        run: npm run check:count

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── STAGE 2: Security — parallel with Stage 1 ─────────────────────────────
  # Secret scanning is NOT duplicated here: gitleaks.yml scans full history with
  # fetch-depth 0, and GitHub-native secret scanning + push protection are on.
  # A third scanner would add runtime and find the same nothing.
  security:
    name: 'Stage 2 · Security'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # "npm audit reports zero vulnerabilities" appears in README.md and in the
      # submission copy. Until now nothing asserted it on a push.
      - name: Dependency audit (high + critical)
        run: npm audit --audit-level=high

      # The dependency count is a published, greppable claim — "1 runtime, 6 dev"
      # — and it is load-bearing twice over: it is the argument for having no
      # linter, and every added package weakens the supply-chain story. Fail if
      # it moves, so that adding one is a decision rather than an accident.
      - name: Dependency count is 1 runtime, 6 dev
        run: |
          RUNTIME=$(node -p "Object.keys(require('./package.json').dependencies||{}).length")
          DEV=$(node -p "Object.keys(require('./package.json').devDependencies||{}).length")
          echo "runtime=$RUNTIME dev=$DEV"
          if [ "$RUNTIME" -ne 1 ] || [ "$DEV" -ne 6 ]; then
            echo "::error::Dependency count changed: $RUNTIME runtime / $DEV dev (published: 1 / 6)."
            echo "Update README.md, NOTICE.md and the submission copy in the same change, then this gate."
            exit 1
          fi

  # ── STAGE 3: Build verification ───────────────────────────────────────────
  build:
    name: 'Stage 3 · Build'
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # vite build, then U-DIST greps the shipped bundle — no *.vercel.app, no
      # third-party origin, no dev-only route surviving tree-shaking.
      - name: Build and grep the shipped bundle
        run: npm run check:build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── STAGE 4: End-to-end, in a real browser ────────────────────────────────
  e2e:
    name: 'Stage 4 · E2E'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The R11 gate: model-bundle SHA-256, then the measurement and disclosure
      # assertions on recorded pixels. Assertions whose fixture is not yet
      # recorded report as SKIPPED with a named reason, never as passing.
      - name: R11 gate
        run: npm run verify

      # The WHOLE suite. This previously ran two of the five spec files, so the
      # print and measurement suites — both named in the README — were never
      # exercised on a push.
      - name: Full end-to-end suite
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── STAGE 5: Performance and DSP correctness ──────────────────────────────
  performance:
    name: 'Stage 5 · Performance'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # All six credit/refusal outcomes driven end-to-end from an analytic
      # signal, asserted before a single timing prints. Then p50/p95/p99 against
      # the 33.33 ms frame budget.
      #
      # The COUNTS are asserted and are byte-deterministic across machines. The
      # TIMINGS are printed and NOT asserted, because a timing assertion on a
      # shared runner is a flaky assertion — and a flaky gate teaches people to
      # re-run rather than to read.
      - name: DSP correctness gate and frame budget
        run: npm run bench

  # ── STAGE 6: Aggregate gate ───────────────────────────────────────────────
  # One name to require in branch protection, so adding a stage later does not
  # mean editing the protection rule. Fails if ANY upstream stage did not
  # succeed — `always()` plus an explicit result test, because a bare `needs:`
  # would let a skipped stage read as a pass.
  gate:
    name: 'Stage 6 · Gate'
    needs: [quality, security, build, e2e, performance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every stage must have succeeded
        run: |
          echo "quality=${{ needs.quality.result }}"
          echo "security=${{ needs.security.result }}"
          echo "build=${{ needs.build.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          echo "performance=${{ needs.performance.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
          || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] \
          || [ "${{ contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::One or more stages did not succeed."
            exit 1
          fi
          echo "All six stages green."
