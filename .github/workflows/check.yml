name: check

# Runs on every push and pull request. This is the correctness gate.
#
# It is deliberately decoupled from the deploy: a red run here does not block
# publishing, and a green one does not trigger one. Release and deploy live in
# release.yml, which runs these same commands again before it ships anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Unit tests against analytic ground truth + the eight mechanical greps.
      # Fully offline; reads only files committed in this repo.
      - name: Unit tests and mechanical checks
        run: npm test

      # The production bundle, then U-DIST over it.
      - name: Build and grep the shipped bundle
        run: npm run check:build

      # The DSP correctness gate — all six credit/refusal outcomes driven
      # end-to-end from an analytic signal — followed by the frame-budget
      # timings. Also fully offline. The TIMINGS are not asserted, because a
      # timing assertion on a shared runner is a flaky assertion; the COUNTS are,
      # and they are byte-deterministic.
      - name: DSP correctness gate and frame budget
        run: npm run bench

      # The R11 gate. It downloads a Chromium build if the runner has none — the
      # one network access in the proof suite, stated at the top of
      # scripts/verify.mjs. Assertions whose fixture is not yet recorded are
      # reported as skipped with a named reason, never as passing.
      - name: R11 gate
        run: npm run verify

      # The browser-driven accessibility and privacy gates.
      - name: Accessibility and origin gates
        run: npx playwright test e2e/a11y.spec.ts e2e/origins.spec.ts
