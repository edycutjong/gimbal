name: check

# There is exactly one workflow and it runs three commands.
#
# It is a SIGNAL, NOT A GATE: the deploy is decoupled from it, so a red run does
# not block publishing. The real gate is the pre-submit checklist run by hand.
# Coupling a production-hitting spec to every push would buy no signal this does
# not already give, and would tie the workflow to a deploy this deliberately
# leaves independent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Unit tests against analytic ground truth + the seven mechanical greps.
      # Fully offline; reads only files committed in this repo.
      - run: npm test

      # The production bundle, then U-DIST over it.
      - run: npm run check:build

      # The R11 gate. Its first step installs Chromium, so a clean clone needs
      # nothing but `npm ci`. Assertions whose fixture is not yet recorded are
      # reported as skipped with a named reason, never as passing.
      - run: npm run verify
