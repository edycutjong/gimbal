name: release

# Version, tag, changelog, and deploy to Vercel production — in that order, and
# only if the checks pass first.
#
# THE ONLY SECRET THIS NEEDS IS `VERCEL_TOKEN`.
#
# `VERCEL_ORG_ID`, `VERCEL_PROJECT_ID` and `GIMBAL_CANONICAL_URL` are repository
# VARIABLES, not secrets: they are identifiers, useless without the token, and
# they appear in `.vercel/project.json` on any machine that has run
# `vercel link`. The literal fallbacks mean a fresh fork still builds without
# configuring anything, while the variables let this repo be re-pointed at a
# different Vercel project without editing a workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_RJcQx4a22v5LqjetHv8HhhLY' }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_RuTVTV7xmI74MPJAWJmtl03Rj9od' }}
  GIMBAL_CANONICAL_URL: ${{ vars.GIMBAL_CANONICAL_URL || 'https://gimbal.edycu.dev' }}

jobs:
  release:
    runs-on: ubuntu-latest
    # A release commit pushes back to main, which would otherwise re-trigger this
    # workflow forever.
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    permissions:
      contents: write
    steps:
      # Fail FAST. Discovering a missing token after the version has been
      # bumped, committed, tagged and pushed leaves a released tag with nothing
      # deployed behind it — the one state that is annoying to unpick.
      - name: Require the deploy secret before doing anything
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it at Settings → Secrets and variables → Actions."
            echo "It is the only secret this workflow needs; ORG_ID and PROJECT_ID are inline."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # The version script reads tags and the commits since the last one, so
          # a shallow clone would make every release look like the first.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Nothing ships that has not passed the gates.
      - name: Unit tests and mechanical checks
        run: npm test

      - name: Build and grep the shipped bundle
        run: npm run check:build

      - name: R11 gate
        run: npm run verify

      # ── Version ──────────────────────────────────────────────────────────
      - name: Decide the semantic version
        id: version
        run: node scripts/version.mjs

      - name: Commit and tag the release
        if: steps.version.outputs.released == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push --follow-tags

      - name: Publish the GitHub release
        if: steps.version.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "See CHANGELOG.md for the entry generated from the conventional commits in this range."

      # ── Deploy ───────────────────────────────────────────────────────────
      # Every push to main deploys, whether or not it produced a version bump —
      # a docs-only commit still belongs on the canonical URL.
      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN" > deployment-url.txt
          echo "Deployed: $(cat deployment-url.txt)"

      # The deployed headers are what make the privacy claim a browser-enforced
      # invariant rather than a promise, so they are verified against production
      # on every deploy rather than trusted.
      - name: Verify the deployed headers
        run: GIMBAL_URL=$(cat deployment-url.txt) npm run check:deploy
